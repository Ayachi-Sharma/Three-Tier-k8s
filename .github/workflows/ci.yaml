name: CI Pipeline            # label shown in the Actions tab

on:                          # WHEN should this run?
  push:                      # on a git push...
    branches: [main]         # ...but only to the main branch

jobs:                        # WHAT should run (a workflow has one or more jobs)
  build-and-push:            # name of the job (you choose it)
    runs-on: ubuntu-latest   # the machine type GitHub gives you

    steps:                   # commands of this job, run in order
      - name: Checkout code  # label for this step in the logs
        uses: actions/checkout@v4
                             # ready-made action: downloads your repo onto the runner

      - name: Login to Docker Hub
        uses: docker/login-action@v3
                             # ready-made action: runs docker login for you
        with:                # inputs for that action
          username: ${{ secrets.DOCKERHUB_USERNAME }}
                             # reads the secret you saved in GitHub
          password: ${{ secrets.DOCKERHUB_TOKEN }}
                             # the token, never your real password

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ YOUR_DOCKERHUB_USERNAME }}/meditrack-backend:latest
      
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: VITE_API_URL=http://localhost:5000
          push: true
          tags: ${{ YOUR_DOCKERHUB_USERNAME }}/meditrack-frontend:latest