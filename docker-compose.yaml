services: 
  backend:
    image: meditrack-backend 
    build: ./backend
    ports: 
      - "5000:5000"
    env_file: ./backend/.env
  
  frontend:
    image: meditrack-frontend
    build: 
      context: ./frontend
      args: 
        VITE_API_URL: http://localhost:5000
    ports: 
      - "8000:80"
    depends_on: 
      - backend